# dsh-ark-plans bundle patch — the whole provider declaration of this plugin.
#
# What this bundle does: it contributes TWO provider routes and no wire code.
# Both Volcengine Ark plan lanes speak the OpenAI-compatible protocol, so they ride
# the shipped `@deepseek-ai/dsh-llm-pi-ai` adapter, which `@deepseek-ai/dsh-base`
# mounts dormant (zero routes until a profile supplies providers). The two routes
# therefore behave exactly like any other pi-ai route: they appear in the web
# Settings → Models page, the API key is typed there (never into this file), and the
# model selector lists the `models` entries below.
#
# Endpoints (verified live against an Agent Plan subscription, 2026-09-17):
#   Agent Plan  https://ark.cn-beijing.volces.com/api/plan/v3    → POST /chat/completions  200
#   Coding Plan https://ark.cn-beijing.volces.com/api/coding/v3  → POST /chat/completions  (route exists; 401 without a Coding Plan key)
# The `/v3` segment is the OpenAI-compatible surface; the Anthropic-compatible one is
# the same base without it (`/api/plan`, `/api/coding`) and is NOT used here.
#
# ★ PATCH SEMANTICS — read before editing: a patch replaces the targeted row's WHOLE
#   `config`, it does not merge into it. dsh-base mounts `llm-pi-ai` with no config at
#   all, so this file restates every key this bundle owns. Later layers still win: a
#   user's profile `cordis.patch.yml`, or any later bundle patch that targets the same
#   row, replaces this config wholesale, and a user's `llm-pi-ai:` section in
#   settings.yaml always merges over it per provider.
#
# ★ `models` REPLACES the route's catalog wholesale (a hand-declared route has no
#   installed catalog to extend), and a route pi-ai does not ship requires
#   `api` + `baseURL` + a non-empty `models` list. Every model id below is an id the
#   Agent Plan lane actually served when probed; ids it answered 404 `UnsupportedModel`
#   for were left out rather than guessed. The Coding Plan lane is deliberately seeded
#   with the one id that is documented for it — the `ark-code-latest` routing model —
#   because no Coding Plan key was available to probe its catalog here.
#
# Adding a model (no plugin update needed): put it in your own settings.yaml, which
# merges over this base per provider:
#   llm-pi-ai:
#     providers:
#       ark-agent-plan:
#         models:
#           - id: doubao-seed-code
#             name: Doubao-Seed-Code
#             contextWindow: 262144

- insert:
    - id: ark-plans
      name: dsh-ark-plans

- id: llm-pi-ai
  config:
    providers:
      ark-agent-plan:
        displayName: 火山方舟 Agent Plan
        api: openai-completions
        baseURL: https://ark.cn-beijing.volces.com/api/plan/v3
        apiKeyEnv: ARK_AGENT_PLAN_API_KEY
        defaultContextWindow: 262144
        defaultMaxTokens: 32768
        models:
          - id: ark-code-latest
            name: Ark 智能路由 (ark-code-latest)
            contextWindow: 262144
          - id: doubao-seed-evolving
            name: Doubao-Seed-Evolving
            contextWindow: 262144
          - id: doubao-seed-2-1-turbo
            name: Doubao-Seed-2.1-Turbo
            contextWindow: 262144
          - id: doubao-seed-2-0-lite
            name: Doubao-Seed-2.0-Lite
            contextWindow: 262144
          - id: doubao-seed-2-0-mini
            name: Doubao-Seed-2.0-Mini
            contextWindow: 262144
          - id: glm-5.3
            name: GLM-5.3
            contextWindow: 1048576
          - id: glm-5-3-flash
            name: GLM-5.3-Flash
            contextWindow: 1048576
          - id: kimi-k3
            name: Kimi-K3
            contextWindow: 200000
          - id: kimi-k2.7-code
            name: Kimi-K2.7-Code
            contextWindow: 200000
          - id: minimax-m3
            name: MiniMax-M3
            contextWindow: 200000
          - id: deepseek-v4-pro
            name: DeepSeek-V4-Pro
            contextWindow: 1048576
          - id: deepseek-v4-flash
            name: DeepSeek-V4-Flash
            contextWindow: 1048576

      ark-coding-plan:
        displayName: 火山方舟 Coding Plan
        api: openai-completions
        baseURL: https://ark.cn-beijing.volces.com/api/coding/v3
        apiKeyEnv: ARK_CODING_PLAN_API_KEY
        defaultContextWindow: 262144
        defaultMaxTokens: 32768
        models:
          - id: ark-code-latest
            name: Ark 智能路由 (ark-code-latest)
            contextWindow: 262144
