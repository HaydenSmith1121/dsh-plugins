name: 校验

# 每次 push / PR 都跑的校验。
#
# 它拦的是三类「界面上完全看不出来」的问题：
#   ① 目录与生成器脱节 —— catalog/index.json 与 catalog/plugins/*.json 不一致，
#      或者某个文件的字段顺序/时间戳被手工改过（那会让每日同步产生噪音 diff）
#   ② 改了源码却忘了重打市场包 —— 同一个 tarball 路径内容变了时 pnpm 会跳过解包，
#      已经装过的人永远收不到新版本。这里用 git diff 把它逼出来
#   ③ 改变目录的日常刷洗会**改到市场包**（包内嵌了一份离线兜底目录）——
#      兜底目录因此必须是目录的「稳定投影」，登记性字段一律不进包
#
# 两个 job 的联网情况不一样，别一刀切：
#   · 目录一致性 —— 完全不联网。它比的是仓库里已有的文件，快且确定。
#   · 市场插件可构建 —— **要联网一次**：闸门那组测试必须对着真实的
#     @deepseek-ai/dsh 安装判定（详见那一步的注释），所以会装一遍 harness。
#     这是刻意的取舍：一个恒红的测试等于没有测试，而「只在 CI 红」的测试
#     很快就会被人忽略。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalog:
    name: 目录一致性
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.19'

      - name: 目录与生成器一致（不联网）
        run: node scripts/sync-catalog.mjs --check

      - name: ★ --check 必须是只读的（它曾经删掉过 7482 个文件）
        run: |
          set -euo pipefail
          # 出过一次真事故：--check 的早退分支被写进了一个不再被调用的函数里，
          # 入口直接走到了联网采集那条路 —— 于是这条「只读校验」拿着一个空的公开索引
          # 缓存去推演目录，判定 7482 个配置文件是多余的，把它们删了，然后 exit 0。
          # 断言比注释可靠：跑完校验，工作区必须一个字节都没变。
          if ! git diff --quiet; then
            echo "::error::--check 改动了工作区 —— 它必须是只读的。"
            git --no-pager diff --stat
            exit 1
          fi
          echo "--check 没有改动任何文件。"

      - name: 配置文件数量与索引对得上
        run: |
          set -euo pipefail
          files=$(ls catalog/plugins/*.json | wc -l)
          indexed=$(node -e "console.log(require('./catalog/index.json').counts.total)")
          echo "catalog/plugins/*.json = $files，index.json 记录 = $indexed"
          if [ "$files" -ne "$indexed" ]; then
            echo "::error::配置文件数量与索引不一致 —— 请重跑 node scripts/sync-catalog.mjs"
            exit 1
          fi

  market:
    name: 市场插件可构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.19'

      # ★ 顺序不能反：测试跑的是**打包产物**（.build/package/lib/*.js 与包内目录），
      #   而不是源码树 —— 这样才拦得住「源码里对、装到 profile 后资源路径全错」
      #   那一类问题（见 test/layout.test.mjs 的说明）。
      #   所以必须先构建再测试。原先反着写，CI 每次都在测试那一步报「缺少构建产物」。
      - name: 构建（会重打 tarball）
        run: node plugins-src/dsh-plugins-market/build.mjs

      # ★ 这一步要联网，而且不小 —— 为什么还是必须有它
      #
      #   闸门那组测试断言的是「**给定一个环境**，这个插件放不放行」。而「环境」的第一件事
      #   就是找到真实的 @deepseek-ai/dsh 安装目录（findDshInstall），再从中解析
      #   @deepseek-ai/dsh-llm 的版本 —— peer 判定拿它当基准，「本机缺接口」这类硬拦截
      #   全靠它才判得出来。
      #
      #   干净的 runner 上这两样都没有，于是环境层直接 FATAL 返回、「每一个插件都被硬拦截」，
      #   五条测试全红。红得很有道理，只是指向了错误的地方：看起来像闸门坏了，其实是
      #   被测环境是空的。实测代价是一次 CI 运行 —— 所以这里照闸门自己给用户的提示装一遍。
      #
      #   顺带还验了一件事：compatibility.json 兼容矩阵里那个版本**真的能从 npm 装上**。
      #   版本号显式取自矩阵，不写死 —— 矩阵改了这里跟着改，不会悄悄装成别的版本。
      - name: 装真 harness（闸门测试要对着真实安装判定，不能对着空容器）
        run: |
          set -euo pipefail
          ver=$(node -e "const c=require('./compatibility.json');const r=c.runtimes.find(x=>x.status==='supported')??c.runtimes[0];process.stdout.write(r.dshVersion)")
          echo "按 compatibility.json 装 dsh@${ver} + pnpm@10（后者要在同一前缀下，否则闸门只告警）"
          npm i -g --no-audit --no-fund "@deepseek-ai/dsh@${ver}" pnpm@10
          npm ls -g --depth=0

      - name: 单元测试（针对打包产物）
        working-directory: plugins-src/dsh-plugins-market
        run: node test/run.mjs

      - name: 产物必须已提交，且内容一致
        run: |
          set -euo pipefail
          # build.mjs 是确定性的：同样的输入必得同样的字节（归档里的 mtime 是固定值、
          # gzip 头由我们自己写死，见 build.mjs 的 gzipDeterministic）。
          # 所以只要它跑完 git 里有 diff，就说明「源码改了但没重新构建并提交」。
          if ! git diff --quiet -- plugins/ ; then
            echo "::error::plugins/ 下的 tarball 与当前源码不一致 —— 请本地跑一次 node plugins-src/dsh-plugins-market/build.mjs 并提交产物。"
            git --no-pager diff --stat -- plugins/
            # ★ 顺手把「该往哪儿看」也印出来。两种形态的成因完全不同：
            #   · 前后字节数不同      → 包里的内容真的变了（十有八九是忘了重新构建）
            #   · 前后字节数相同      → 同长不同内容，去看压缩器/平台相关的那部分，
            #                            不要先翻源码（实测在这上面浪费过一轮 CI）
            echo '--- 判定提示 ---'
            echo '若上面显示 "Bin N -> N bytes"（同长），差异几乎一定不在源码内容里，'
            echo '而在归档容器/压缩器的平台相关字节上（历史事故：zlib 的 gzip 头 OS 字段）。'
            exit 1
          fi
          echo "产物与源码一致。"

      - name: 源码树里不能混进构建产物
        run: |
          set -euo pipefail
          # 构建产物一律落在 .build/ 下 —— 构建不该改动它自己的输入。
          # 早先的版本把生成的 package.json / README.md 直接写回包根，
          # 结果源码被自己的产物覆盖过。
          for rel in plugins-src/dsh-plugins-market/lib plugins-src/dsh-plugins-market/catalog; do
            if [ -e "$rel" ]; then
              echo "::error::$rel 不该存在（那是构建产物，应当在 .build/ 下）"
              exit 1
            fi
          done
          echo "源码树干净。"
